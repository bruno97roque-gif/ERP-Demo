<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floreria ERP</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">✿</span><div><b>Floreria</b><small>ERP · demo</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="cashBox"></div>
      <label class="user-pick"><span id="avatar" class="avatar"></span>
        <span class="who"><small>Sesion de</small><select id="user"></select></span></label>
    </div>
  </aside>
  <main>
    <header class="top"><div><h1 id="title"></h1><p id="subtitle"></p></div><div id="topActions" class="top-actions"></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts"></div>
<script src="app.js"></script>
</body>
</html>
